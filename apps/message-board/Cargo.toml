[package]
name = "message-board"
version = "0.3.0"
edition = "2024"
publish = false
description = "Local long-poll message board (notes, threads and queues in a tree) for agent coordination"

[lib]
path = "src/lib.rs"

[[bin]]
name = "board"
path = "src/bin/board/main.rs"

[[bin]]
name = "board-server"
path = "src/bin/board-server/main.rs"

[[bin]]
name = "board-admin"
path = "src/bin/board-admin/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = "3"
form_urlencoded = "1.2"
getrandom = "0.4"
httparse = "1.10"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rusqlite = "0.40"
rusqlite_migration = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
signal-hook = "0.4"
thiserror = "2"
ureq = { version = "3.5", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
# println!/eprintln! panic when the stream is gone; write to locked handles instead
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
# A panic ends the process: no thread dies holding the board's lock and
# leaves the rest serving errors, and systemd restarts the server.
panic = "abort"
